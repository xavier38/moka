<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moka — Confidentialité</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #fbf8f5; --text: #2b211b; --muted: #6b5d53; --accent: #9d6533; --line: #eadfd6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1916; --text: #f3ece6; --muted: #bfb2a8; --accent: #d9a273; --line: #3a312b; } }
  body { margin: 0; font: 18px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header img { width: 56px; height: 56px; }
  h1 { font-size: 32px; margin: 0; }
  nav.langs { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
  nav.langs button { font-size: 22px; background: none; border: 2px solid transparent; border-radius: 10px; padding: 2px 6px; cursor: pointer; }
  nav.langs button[aria-pressed="true"] { border-color: var(--accent); }
  li { margin: 8px 0; }
  a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: 16px; border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<main>
  <header><img src="icon.png" alt=""><h1 data-t="title"></h1><nav class="langs" aria-label="Language"></nav></header>
  <p data-t="intro"></p>
  <ul id="points"></ul>
  <p><span data-t="contact"></span> <a href="mailto:xavier.roubaud@gmail.com">xavier.roubaud@gmail.com</a></p>
  <footer><a href="index.html">Moka</a> · © 2026 Xavier Roubaud · <span data-t="updated"></span></footer>
</main>
<script>
const T = {
  fr: { title: "Confidentialité", intro: "Moka respecte votre vie privée. En résumé : rien de personnel ne quitte votre Mac.", contact: "Une question ?", updated: "Mis à jour le 24 octobre 2026",
    points: ["Si vous cochez « Aider à améliorer Moka » (désactivé par défaut), Moka envoie des statistiques anonymes à TelemetryDeck, un service européen : fonctions utilisées, version de l'app et de macOS. Aucun nom, e-mail ni contenu ; l'identifiant d'installation est aléatoire et haché. Décochez la case pour arrêter à tout moment.", "Moka ne collecte aucune donnée personnelle.", "Moka n'utilise ni publicité, ni outil de mesure d'audience, ni pisteur.", "Pour les mises à jour, Moka demande une fois par jour à GitHub le numéro de la dernière version, sans rien envoyer d'autre (désactivable dans Réglages → Général). Vos réglages restent uniquement sur votre Mac.", "Le bouton « Offrez-moi un café » ouvre PayPal dans votre navigateur : Moka ne voit ni le montant ni vos coordonnées.", "La fonction « Tant que le téléchargement continue » lit seulement la quantité totale de données reçues par le Mac, sans jamais savoir ce qui est téléchargé ni d'où.", "Les notifications, si vous les activez, sont affichées localement par macOS."] },
  en: { title: "Privacy", intro: "Moka respects your privacy. In short: nothing personal leaves your Mac.", contact: "Any questions?", updated: "Updated October 24, 2026",
    points: ["If you check “Help improve Moka” (off by default), Moka sends anonymous statistics to TelemetryDeck, a European service: features used, app and macOS version. No name, email or content; the install identifier is random and hashed. Uncheck it to stop at any time.", "Moka does not collect any personal data.", "Moka uses no ads, no analytics and no trackers.", "To check for updates, Moka asks GitHub for the latest version number once a day and sends nothing else (can be turned off in Settings → General). Your settings stay on your Mac only.", "The “Buy me a coffee” button opens PayPal in your browser: Moka never sees the amount or your details.", "The “While the download continues” feature only reads the total amount of data received by the Mac, never what is downloaded or from where.", "Notifications, if you turn them on, are shown locally by macOS."] },
  es: { title: "Privacidad", intro: "Moka respeta su privacidad. En resumen: nada personal sale de su Mac.", contact: "¿Alguna pregunta?", updated: "Actualizado el 24 de octubre de 2026",
    points: ["Si marca «Ayudar a mejorar Moka» (desactivado por defecto), Moka envía estadísticas anónimas a TelemetryDeck, un servicio europeo: funciones usadas, versión de la app y de macOS. Ningún nombre, correo ni contenido; el identificador de instalación es aleatorio y cifrado. Desmárquelo para detenerlo cuando quiera.", "Moka no recopila ningún dato personal.", "Moka no usa publicidad, ni análisis, ni rastreadores.", "Para las actualizaciones, Moka pregunta una vez al día a GitHub el número de la última versión, sin enviar nada más (se puede desactivar en Ajustes → General). Sus ajustes se quedan solo en su Mac.", "El botón «Invíteme a un café» abre PayPal en su navegador: Moka no ve ni el importe ni sus datos.", "La función «Mientras siga la descarga» solo lee la cantidad total de datos recibidos por el Mac, nunca qué se descarga ni de dónde.", "Las notificaciones, si las activa, las muestra macOS localmente."] },
  pt: { title: "Privacidade", intro: "O Moka respeita sua privacidade. Resumindo: nada pessoal sai do seu Mac.", contact: "Alguma dúvida?", updated: "Atualizado em 24 de outubro de 2026",
    points: ["Se você marcar “Ajudar a melhorar o Moka” (desativado por padrão), o Moka envia estatísticas anônimas ao TelemetryDeck, um serviço europeu: recursos usados, versão do app e do macOS. Nenhum nome, e-mail ou conteúdo; o identificador da instalação é aleatório e criptografado. Desmarque para parar quando quiser.", "O Moka não coleta nenhum dado pessoal.", "O Moka não usa anúncios, análises nem rastreadores.", "Para as atualizações, o Moka pergunta uma vez por dia ao GitHub o número da última versão, sem enviar mais nada (pode ser desativado em Ajustes → Geral). Seus ajustes ficam só no seu Mac.", "O botão “Me pague um café” abre o PayPal no seu navegador: o Moka não vê o valor nem seus dados.", "O recurso “Enquanto o download continuar” lê apenas a quantidade total de dados recebidos pelo Mac, nunca o que é baixado nem de onde.", "As notificações, se ativadas, são exibidas localmente pelo macOS."] },
  nl: { title: "Privacy", intro: "Moka respecteert uw privacy. Kortom: niets persoonlijks verlaat uw Mac.", contact: "Een vraag?", updated: "Bijgewerkt op 24 oktober 2026",
    points: ["Als u ‘Help Moka te verbeteren’ aanvinkt (standaard uit), stuurt Moka anonieme statistieken naar TelemetryDeck, een Europese dienst: gebruikte functies, app- en macOS-versie. Geen naam, e-mail of inhoud; de installatie-ID is willekeurig en gehasht. Vink het uit om op elk moment te stoppen.", "Moka verzamelt geen persoonsgegevens.", "Moka gebruikt geen advertenties, analysetools of trackers.", "Voor updates vraagt Moka één keer per dag aan GitHub het nummer van de nieuwste versie, zonder iets anders te versturen (uit te zetten in Instellingen → Algemeen). Uw instellingen blijven alleen op uw Mac.", "De knop ‘Trakteer me op koffie’ opent PayPal in uw browser: Moka ziet het bedrag en uw gegevens niet.", "De functie ‘Zolang de download doorgaat’ leest alleen de totale hoeveelheid ontvangen gegevens, nooit wat of waarvandaan er wordt gedownload.", "Meldingen, als u ze aanzet, worden lokaal door macOS getoond."] },
  de: { title: "Datenschutz", intro: "Moka respektiert Ihre Privatsphäre. Kurz gesagt: Nichts Persönliches verlässt Ihren Mac.", contact: "Fragen?", updated: "Aktualisiert am 24. Oktober 2026",
    points: ["Wenn Sie „Moka verbessern helfen“ ankreuzen (standardmäßig aus), sendet Moka anonyme Statistiken an TelemetryDeck, einen europäischen Dienst: genutzte Funktionen, App- und macOS-Version. Kein Name, keine E-Mail, keine Inhalte; die Installations-ID ist zufällig und gehasht. Häkchen entfernen, um jederzeit zu stoppen.", "Moka sammelt keine personenbezogenen Daten.", "Moka nutzt weder Werbung noch Analyse-Tools noch Tracker.", "Für Updates fragt Moka einmal am Tag bei GitHub die neueste Versionsnummer ab und sendet sonst nichts (abschaltbar unter Einstellungen → Allgemein). Ihre Einstellungen bleiben nur auf Ihrem Mac.", "Die Taste „Kaffee spendieren“ öffnet PayPal in Ihrem Browser: Moka sieht weder den Betrag noch Ihre Daten.", "Die Funktion „Solange der Download läuft“ liest nur die Gesamtmenge der empfangenen Daten, nie was oder woher heruntergeladen wird.", "Mitteilungen werden, wenn aktiviert, lokal von macOS angezeigt."] },
  it: { title: "Privacy", intro: "Moka rispetta la tua privacy. In breve: nulla di personale lascia il tuo Mac.", contact: "Domande?", updated: "Aggiornato il 24 ottobre 2026",
    points: ["Se selezioni «Aiuta a migliorare Moka» (disattivato per impostazione predefinita), Moka invia statistiche anonime a TelemetryDeck, un servizio europeo: funzioni usate, versione dell'app e di macOS. Nessun nome, email o contenuto; l'identificativo di installazione è casuale e cifrato. Deseleziona per fermare in qualsiasi momento.", "Moka non raccoglie alcun dato personale.", "Moka non usa pubblicità, strumenti di analisi né tracker.", "Per gli aggiornamenti, Moka chiede una volta al giorno a GitHub il numero dell'ultima versione, senza inviare altro (disattivabile in Impostazioni → Generali). Le tue impostazioni restano solo sul tuo Mac.", "Il pulsante «Offrimi un caffè» apre PayPal nel browser: Moka non vede né l'importo né i tuoi dati.", "La funzione «Finché il download continua» legge solo la quantità totale di dati ricevuti dal Mac, mai cosa viene scaricato né da dove.", "Le notifiche, se attivate, sono mostrate localmente da macOS."] }
};
const flags = { fr: "🇫🇷", en: "🇺🇸", es: "🇪🇸", pt: "🇧🇷", nl: "🇳🇱", de: "🇩🇪", it: "🇮🇹" };
const nav = document.querySelector("nav.langs");
function setLang(l) {
  const t = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t[e.dataset.t]);
  document.getElementById("points").innerHTML = t.points.map(p => `<li>${p}</li>`).join("");
  nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  try { localStorage.setItem("lang", l); } catch (e) {}
}
Object.keys(T).forEach(l => {
  const b = document.createElement("button");
  b.textContent = flags[l]; b.dataset.l = l; b.title = l.toUpperCase(); b.onclick = () => setLang(l);
  nav.appendChild(b);
});
let start = "en";
try { start = localStorage.getItem("lang") || (navigator.language || "en").slice(0, 2); } catch (e) {}
setLang(T[start] ? start : "en");
</script>
</body>
</html>
