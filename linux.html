<!doctype html>

<head>
<meta charset="utf-8">

<title>Installer Moka sur Linux</title>
<meta name="description" content="Pour Ubuntu 22.04 ou plus récent, et Debian 12 ou plus récent. Environ trois minutes, avec une seule commande à taper.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#fbf8f5; --text:#2b211b; --muted:#6b5d53; --accent:#9d6533; --card:#fff; --line:#eadfd6; }
  @media (prefers-color-scheme:dark) { :root { --bg:#1d1916; --text:#f3ece6; --muted:#bfb2a8; --accent:#d9a273; --card:#27211d; --line:#3a312b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; }
  main { max-width:960px; margin:auto; padding:24px 16px 64px; }
  a { color:var(--accent); }
  .top { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .back { padding:8px 12px; border:1px solid var(--line); border-radius:10px; text-decoration:none; background:var(--card); }
  .langs { display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; }
  .langs button { font-size:22px; background:none; border:2px solid transparent; border-radius:10px; padding:2px 6px; cursor:pointer; }
  .langs button[aria-pressed="true"] { border-color:var(--accent); }
  h1 { margin:24px 0 4px; font-size:clamp(30px,5vw,42px); line-height:1.15; }
  .intro { margin:0 0 22px; color:var(--muted); }
  .download { display:inline-block; padding:12px 20px; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; text-decoration:none; }
  @media (prefers-color-scheme:dark) { .download { color:#1d1916; } }
  .steps { list-style:none; padding:0; margin:20px 0; display:grid; gap:16px; }
  .step { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:center; gap:20px; padding:18px; border:1px solid var(--line); border-radius:16px; background:var(--card); }
  .step:first-child { display:block; }
  .number { display:inline-grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; }
  @media (prefers-color-scheme:dark) { .number { color:#1d1916; } }
  h2 { margin:8px 0 6px; font-size:22px; line-height:1.25; }
  .step p { margin:0; color:var(--muted); }
  .step .download { margin-top:16px; color:#fff; }
  @media (prefers-color-scheme:dark) { .step .download { color:#1d1916; } }
  .zoom-button { display:block; width:100%; padding:0; border:0; background:none; cursor:zoom-in; border-radius:10px; }
  .zoom-button img { display:block; width:100%; height:auto; border-radius:10px; }
  .zoom-hint { display:block; margin-top:6px; color:var(--accent); font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; text-decoration:underline; }
  .note { padding:18px; border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:12px; background:var(--card); }
  .note p { margin:0 0 10px; }
  .note p:last-child { margin:0; }
  dialog { max-width:min(96vw,1400px); max-height:95vh; border:0; border-radius:12px; padding:12px; background:var(--card); color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.85); }
  dialog img { display:block; max-width:100%; max-height:calc(95vh - 62px); object-fit:contain; }
  .close { display:block; margin:0 0 8px auto; padding:6px 12px; border:1px solid var(--line); border-radius:8px; color:var(--text); background:var(--card); cursor:pointer; font:inherit; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  @media (max-width:700px) { .step { grid-template-columns:1fr; } .langs { margin-left:0; } }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 14px; overflow-x:auto; font-size:16px; color:var(--text); }
  .others { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 0; } .others a { padding:6px 12px; border:1px solid var(--line); border-radius:10px; text-decoration:none; background:var(--card); }
</style>

<script>
const downloadURL = "https://github.com/xavier38/moka/releases/download/pc-v1.0.0/moka.deb";
const OTHER = [["installation.html", "Mac"], ["windows.html", "Windows"]];
const FLAGS = {"fr": "🇫🇷", "en": "🇬🇧", "es": "🇪🇸", "pt": "🇵🇹", "nl": "🇳🇱", "de": "🇩🇪", "it": "🇮🇹"};
const T = {"fr": {"title": "Installer Moka sur Linux", "intro": "Pour Ubuntu 22.04 ou plus récent, et Debian 12 ou plus récent. Environ trois minutes, avec une seule commande à taper.", "download": "Télécharger Moka pour Linux (.deb) — Gratuit", "other": "Autres systèmes :", "steps": [["Téléchargez Moka", "Utilisez le bouton ci-dessous : le fichier moka.deb arrive dans le dossier Téléchargements."], ["Ouvrez un terminal dans Téléchargements", "Ouvrez le dossier Téléchargements, faites un clic droit dans un espace vide et choisissez « Ouvrir dans un terminal »."], ["Installez", "Tapez (ou collez) la commande ci-dessous, puis Entrée, puis votre mot de passe (rien ne s'affiche quand vous le tapez, c'est normal).", "sudo apt install ./moka.deb"], ["Ouvrez Moka", "Cherchez « Moka » dans le menu des applications. La tasse apparaît en haut de l'écran, près de l'horloge."], ["Debian (bureau GNOME) : affichez la tasse", "GNOME n'affiche pas ces icônes tout seul. L'installation a ajouté ce qu'il faut : déconnectez-vous puis reconnectez-vous, ouvrez l'application « Extensions » et activez « AppIndicator ». Ubuntu, lui, l'affiche directement."], ["C'est prêt !", "Cliquez sur la tasse pour ouvrir son menu : « Garder l'ordinateur allumé », les durées, « tant qu'une app est ouverte », le lancement au démarrage."]], "upd_t": "Les mises à jour", "upd": "Quand une nouvelle version est prête, la ligne « Moka X est disponible » apparaît tout en haut du menu de la tasse. Un clic montre les nouveautés et le bouton « Mettre à jour maintenant » : Linux demande votre mot de passe, puis Moka s'installe et repart tout seul.", "rm_t": "Désinstaller", "rm": "Dans un terminal : sudo apt remove moka"}, "en": {"title": "Install Moka on Linux", "intro": "For Ubuntu 22.04 or later, and Debian 12 or later. About three minutes, with a single command to type.", "download": "Download Moka for Linux (.deb) — Free", "other": "Other systems:", "steps": [["Download Moka", "Use the button below: the moka.deb file lands in your Downloads folder."], ["Open a terminal in Downloads", "Open the Downloads folder, right-click an empty area and choose “Open in Terminal”."], ["Install", "Type (or paste) the command below, press Enter, then your password (nothing shows while you type it, that's normal).", "sudo apt install ./moka.deb"], ["Open Moka", "Look for “Moka” in the applications menu. The cup appears at the top of the screen, near the clock."], ["Debian (GNOME desktop): show the cup", "GNOME doesn't show these icons by itself. The installation added what is needed: log out and back in, open the “Extensions” app and turn on “AppIndicator”. Ubuntu shows it directly."], ["You're ready!", "Click the cup to open its menu: “Keep the computer awake”, durations, “while an app is open”, start at login."]], "upd_t": "Updates", "upd": "When a new version is ready, the line “Moka X is available” appears at the very top of the cup menu. One click shows what's new and the “Update Now” button: Linux asks for your password, then Moka installs and starts again on its own.", "rm_t": "Uninstall", "rm": "In a terminal: sudo apt remove moka"}, "es": {"title": "Instalar Moka en Linux", "intro": "Para Ubuntu 22.04 o posterior y Debian 12 o posterior. Unos tres minutos, con un solo comando.", "download": "Descargar Moka para Linux (.deb) — Gratis", "other": "Otros sistemas:", "steps": [["Descargue Moka", "Use el botón de abajo: el archivo moka.deb llega a la carpeta Descargas."], ["Abra un terminal en Descargas", "Abra la carpeta Descargas, haga clic derecho en un espacio vacío y elija «Abrir en una terminal»."], ["Instale", "Escriba (o pegue) el comando de abajo, pulse Intro y luego su contraseña (no se ve nada al escribirla, es normal).", "sudo apt install ./moka.deb"], ["Abra Moka", "Busque «Moka» en el menú de aplicaciones. La taza aparece arriba de la pantalla, junto al reloj."], ["Debian (escritorio GNOME): muestre la taza", "GNOME no muestra estos iconos por sí solo. La instalación añadió lo necesario: cierre la sesión y vuelva a entrar, abra la app «Extensiones» y active «AppIndicator». Ubuntu la muestra directamente."], ["¡Listo!", "Haga clic en la taza para abrir su menú: «Mantener el ordenador encendido», duraciones, «mientras una app esté abierta», inicio con la sesión."]], "upd_t": "Actualizaciones", "upd": "Cuando hay una nueva versión, la línea «Moka X está disponible» aparece arriba del todo en el menú de la taza. Un clic muestra las novedades y el botón «Actualizar ahora»: Linux pide su contraseña y luego Moka se instala y vuelve a abrirse solo.", "rm_t": "Desinstalar", "rm": "En un terminal: sudo apt remove moka"}, "pt": {"title": "Instalar o Moka no Linux", "intro": "Para Ubuntu 22.04 ou mais recente e Debian 12 ou mais recente. Cerca de três minutos, com um único comando.", "download": "Baixar o Moka para Linux (.deb) — Grátis", "other": "Outros sistemas:", "steps": [["Baixe o Moka", "Use o botão abaixo: o arquivo moka.deb vai para a pasta Downloads."], ["Abra um terminal em Downloads", "Abra a pasta Downloads, clique com o botão direito num espaço vazio e escolha «Abrir no terminal»."], ["Instale", "Digite (ou cole) o comando abaixo, pressione Enter e depois a sua senha (nada aparece enquanto digita, é normal).", "sudo apt install ./moka.deb"], ["Abra o Moka", "Procure «Moka» no menu de aplicativos. A xícara aparece no topo da tela, perto do relógio."], ["Debian (área de trabalho GNOME): mostre a xícara", "O GNOME não mostra estes ícones sozinho. A instalação adicionou o necessário: saia da sessão e entre de novo, abra o app «Extensões» e ative «AppIndicator». O Ubuntu mostra diretamente."], ["Pronto!", "Clique na xícara para abrir o menu: «Manter o computador acordado», durações, «enquanto um app estiver aberto», iniciar com a sessão."]], "upd_t": "Atualizações", "upd": "Quando uma nova versão está pronta, a linha «O Moka X está disponível» aparece no topo do menu da xícara. Um clique mostra as novidades e o botão «Atualizar agora»: o Linux pede a sua senha, depois o Moka instala e volta a abrir sozinho.", "rm_t": "Desinstalar", "rm": "Num terminal: sudo apt remove moka"}, "nl": {"title": "Moka installeren op Linux", "intro": "Voor Ubuntu 22.04 of nieuwer en Debian 12 of nieuwer. Ongeveer drie minuten, met één opdracht.", "download": "Moka voor Linux downloaden (.deb) — Gratis", "other": "Andere systemen:", "steps": [["Download Moka", "Gebruik de knop hieronder: het bestand moka.deb komt in de map Downloads."], ["Open een terminal in Downloads", "Open de map Downloads, klik met de rechtermuisknop op een lege plek en kies „Openen in terminal”."], ["Installeer", "Typ (of plak) de opdracht hieronder, druk op Enter en daarna uw wachtwoord (er verschijnt niets tijdens het typen, dat is normaal).", "sudo apt install ./moka.deb"], ["Open Moka", "Zoek „Moka” in het menu met toepassingen. Het kopje verschijnt bovenaan het scherm, bij de klok."], ["Debian (GNOME-bureaublad): toon het kopje", "GNOME toont deze pictogrammen niet vanzelf. De installatie heeft toegevoegd wat nodig is: meld u af en weer aan, open de app „Uitbreidingen” en zet „AppIndicator” aan. Ubuntu toont het direct."], ["Klaar!", "Klik op het kopje om het menu te openen: „Computer wakker houden”, duur, „zolang een app open is”, starten bij aanmelden."]], "upd_t": "Updates", "upd": "Staat er een nieuwe versie klaar, dan verschijnt de regel „Moka X is beschikbaar” helemaal bovenaan in het menu van het kopje. Eén klik toont wat er nieuw is en de knop „Nu bijwerken”: Linux vraagt om uw wachtwoord, daarna installeert Moka zich en start vanzelf opnieuw.", "rm_t": "Verwijderen", "rm": "In een terminal: sudo apt remove moka"}, "de": {"title": "Moka unter Linux installieren", "intro": "Für Ubuntu 22.04 oder neuer und Debian 12 oder neuer. Etwa drei Minuten, mit einem einzigen Befehl.", "download": "Moka für Linux herunterladen (.deb) — Kostenlos", "other": "Andere Systeme:", "steps": [["Laden Sie Moka herunter", "Nutzen Sie die Schaltfläche unten: Die Datei moka.deb landet im Ordner Downloads."], ["Öffnen Sie ein Terminal in Downloads", "Öffnen Sie den Ordner Downloads, klicken Sie mit der rechten Maustaste auf eine freie Stelle und wählen Sie „Im Terminal öffnen“."], ["Installieren Sie", "Tippen (oder fügen) Sie den Befehl unten ein, drücken Sie die Eingabetaste und geben Sie Ihr Passwort ein (beim Tippen erscheint nichts, das ist normal).", "sudo apt install ./moka.deb"], ["Öffnen Sie Moka", "Suchen Sie „Moka“ im Anwendungsmenü. Die Tasse erscheint oben am Bildschirm neben der Uhr."], ["Debian (GNOME-Desktop): Tasse anzeigen", "GNOME zeigt solche Symbole nicht von selbst. Die Installation hat das Nötige hinzugefügt: Melden Sie sich ab und wieder an, öffnen Sie die App „Erweiterungen“ und schalten Sie „AppIndicator“ ein. Ubuntu zeigt sie direkt."], ["Fertig!", "Klicken Sie auf die Tasse, um ihr Menü zu öffnen: „Computer wach halten“, Dauer, „solange eine App geöffnet ist“, Start bei der Anmeldung."]], "upd_t": "Updates", "upd": "Ist eine neue Version bereit, erscheint die Zeile „Moka X ist verfügbar“ ganz oben im Menü der Tasse. Ein Klick zeigt die Neuerungen und die Schaltfläche „Jetzt aktualisieren“: Linux fragt nach Ihrem Passwort, dann installiert sich Moka und startet von selbst neu.", "rm_t": "Deinstallieren", "rm": "In einem Terminal: sudo apt remove moka"}, "it": {"title": "Installare Moka su Linux", "intro": "Per Ubuntu 22.04 o successivo e Debian 12 o successivo. Circa tre minuti, con un solo comando.", "download": "Scarica Moka per Linux (.deb) — Gratis", "other": "Altri sistemi:", "steps": [["Scarica Moka", "Usa il pulsante qui sotto: il file moka.deb arriva nella cartella Download."], ["Apri un terminale in Download", "Apri la cartella Download, fai clic destro in uno spazio vuoto e scegli «Apri nel terminale»."], ["Installa", "Digita (o incolla) il comando qui sotto, premi Invio e poi la tua password (mentre la digiti non compare nulla, è normale).", "sudo apt install ./moka.deb"], ["Apri Moka", "Cerca «Moka» nel menu delle applicazioni. La tazza compare in alto sullo schermo, vicino all'orologio."], ["Debian (desktop GNOME): mostra la tazza", "GNOME non mostra queste icone da solo. L'installazione ha aggiunto il necessario: esci e rientra nella sessione, apri l'app «Estensioni» e attiva «AppIndicator». Ubuntu la mostra direttamente."], ["È pronto!", "Fai clic sulla tazza per aprirne il menu: «Tieni acceso il computer», durate, «finché un'app è aperta», avvio all'accesso."]], "upd_t": "Aggiornamenti", "upd": "Quando è pronta una nuova versione, la riga «Moka X è disponibile» compare in cima al menu della tazza. Un clic mostra le novità e il pulsante «Aggiorna ora»: Linux chiede la password, poi Moka si installa e riparte da solo.", "rm_t": "Disinstallare", "rm": "In un terminale: sudo apt remove moka"}};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(lang) {
  const t = T[lang] || T.en;
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("title").textContent = t.title;
  document.getElementById("intro").textContent = t.intro;
  document.getElementById("steps").innerHTML = t.steps.map((s, i) => `<li class="step"><div><span class="number">${i + 1}</span><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>` +
    (s[2] ? `<pre>${esc(s[2])}</pre>` : "") + (i === 0 ? `<a class="download" href="${downloadURL}">⬇︎ ${esc(t.download)}</a>` : "") + `</div></li>`).join("");
  document.getElementById("notes").innerHTML = (t.why_t ? `<p><b>${esc(t.why_t)}</b> ${esc(t.why)}</p>` : "") +
    `<p><b>${esc(t.upd_t)}</b> ${esc(t.upd)}</p><p><b>${esc(t.rm_t)}</b> ${esc(t.rm)}</p>`;
  document.getElementById("others").innerHTML = esc(t.other) + " " + OTHER.map(([h, n]) => `<a href="${h}">${n}</a>`).join(" ");
  document.getElementById("langs").innerHTML = Object.keys(T).map((l) => `<button type="button" data-l="${l}" aria-pressed="${l === lang}" title="${l}">${FLAGS[l]}</button>`).join("");
  try { localStorage.setItem("lang", lang); } catch (e) {}
}
document.getElementById("langs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.l); });
let start = "fr";
try { start = localStorage.getItem("lang") || ""; } catch (e) {}
if (!T[start]) start = ((navigator.language || "fr").slice(0, 2).toLowerCase());
show(T[start] ? start : "en");
</script>
