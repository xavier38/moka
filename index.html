const nav = document.querySelector("nav.langs");
function setLang(l) {
  const t = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t[e.dataset.t]);
  document.getElementById("faq").innerHTML = t.faq.map(([q, a]) => `<div class="card"><h3>${q}</h3><p>${a}</p></div>`).join("");
  document.getElementById("firstSteps").innerHTML = t.firstSteps.map(s => `<li>${s}</li>`).join("");
  document.getElementById("shot").src = "shot-" + l + ".png";
  nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  showCount();
  try { localStorage.setItem("lang", l); } catch (e) {}
}
Object.keys(T).forEach(l => {
  const b = document.createElement("button");
  b.textContent = flags[l]; b.dataset.l = l; b.title = l.toUpperCase(); b.onclick = () => setLang(l);
  nav.appendChild(b);
});
// Compteur de téléchargements : total de Moka.zip sur toutes les versions publiées (API publique de GitHub)
let downloads = null, launch = null;
function showCount() {
  const e = document.getElementById("dlCount");
  if (!downloads) return;
  const l = document.documentElement.lang;
  const day = launch ? " " + T[l].since + " " + new Intl.DateTimeFormat(l, { dateStyle: "long" }).format(launch) : "";
  e.textContent = "⬇ " + new Intl.NumberFormat(l).format(downloads) + " " + T[l].downloads + day;
  e.hidden = false;
}
fetch("https://api.github.com/repos/xavier38/moka/releases?per_page=100")
  .then(r => r.ok ? r.json() : [])
  .then(rel => {
    downloads = rel.flatMap(x => x.assets || []).filter(a => a.name.endsWith(".zip"))
                   .reduce((n, a) => n + a.download_count, 0);
    // Date de lancement : la toute première version publiée
    const dates = rel.map(x => x.published_at).filter(Boolean).sort();
    if (dates.length) launch = new Date(dates[0]);
    showCount();
  })
  .catch(() => {});
