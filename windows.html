<title>Installer Moka sur Windows</title>
<meta name="description" content="Six étapes, environ trois minutes. Pour Windows 10 et 11. Aucun mot de passe administrateur n'est demandé.">

<style>
  :root { --bg:#fbf8f5; --text:#2b211b; --muted:#6b5d53; --accent:#9d6533; --card:#fff; --line:#eadfd6; }
  @media (prefers-color-scheme:dark) { :root { --bg:#1d1916; --text:#f3ece6; --muted:#bfb2a8; --accent:#d9a273; --card:#27211d; --line:#3a312b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; }
  main { max-width:960px; margin:auto; padding:24px 16px 64px; }
  a { color:var(--accent); }
  .top { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .back { padding:8px 12px; border:1px solid var(--line); border-radius:10px; text-decoration:none; background:var(--card); }
  .langs { display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; }
  .langs button { font-size:22px; background:none; border:2px solid transparent; border-radius:10px; padding:2px 6px; cursor:pointer; }
  .langs button[aria-pressed="true"] { border-color:var(--accent); }
  h1 { margin:24px 0 4px; font-size:clamp(30px,5vw,42px); line-height:1.15; }
  .intro { margin:0 0 22px; color:var(--muted); }
  .download { display:inline-block; padding:12px 20px; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; text-decoration:none; }
  @media (prefers-color-scheme:dark) { .download { color:#1d1916; } }
  .steps { list-style:none; padding:0; margin:20px 0; display:grid; gap:16px; }
  .step { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:center; gap:20px; padding:18px; border:1px solid var(--line); border-radius:16px; background:var(--card); }
  .step:first-child { display:block; }
  .number { display:inline-grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; }
  @media (prefers-color-scheme:dark) { .number { color:#1d1916; } }
  h2 { margin:8px 0 6px; font-size:22px; line-height:1.25; }
  .step p { margin:0; color:var(--muted); }
  .step .download { margin-top:16px; color:#fff; }
  @media (prefers-color-scheme:dark) { .step .download { color:#1d1916; } }
  .zoom-button { display:block; width:100%; padding:0; border:0; background:none; cursor:zoom-in; border-radius:10px; }
  .zoom-button img { display:block; width:100%; height:auto; border-radius:10px; }
  .zoom-hint { display:block; margin-top:6px; color:var(--accent); font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; text-decoration:underline; }
  .note { padding:18px; border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:12px; background:var(--card); }
  .note p { margin:0 0 10px; }
  .note p:last-child { margin:0; }
  dialog { max-width:min(96vw,1400px); max-height:95vh; border:0; border-radius:12px; padding:12px; background:var(--card); color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.85); }
  dialog img { display:block; max-width:100%; max-height:calc(95vh - 62px); object-fit:contain; }
  .close { display:block; margin:0 0 8px auto; padding:6px 12px; border:1px solid var(--line); border-radius:8px; color:var(--text); background:var(--card); cursor:pointer; font:inherit; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  @media (max-width:700px) { .step { grid-template-columns:1fr; } .langs { margin-left:0; } }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 14px; overflow-x:auto; font-size:16px; color:var(--text); }
  .others { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 0; } .others a { padding:6px 12px; border:1px solid var(--line); border-radius:10px; text-decoration:none; background:var(--card); }
</style>

<script>
const downloadURL = "https://github.com/xavier38/moka/releases/download/pc-v1.0.1/Moka-Setup.exe";
const OTHER = [["installation.html", "Mac"], ["linux.html", "Linux"]];
const FLAGS = {"fr": "🇫🇷", "en": "🇬🇧", "es": "🇪🇸", "pt": "🇵🇹", "nl": "🇳🇱", "de": "🇩🇪", "it": "🇮🇹"};
const T = {"fr": {"title": "Installer Moka sur Windows", "intro": "Six étapes, environ trois minutes. Pour Windows 10 et 11. Aucun mot de passe administrateur n'est demandé.", "download": "Télécharger Moka pour Windows — Gratuit", "other": "Autres systèmes :", "steps": [["Téléchargez Moka", "Utilisez le bouton ci-dessous. Si Edge affiche « Moka-Setup.exe n'est pas fréquemment téléchargé », cliquez sur les trois points … à côté, puis « Conserver », « Afficher plus » et « Conserver quand même »."], ["Ouvrez le fichier", "Double-cliquez sur Moka-Setup.exe dans le dossier Téléchargements."], ["« Windows a protégé votre ordinateur » : c'est normal", "Une fenêtre bleue s'affiche. Cliquez sur « Informations complémentaires » (le petit lien sous le texte), puis sur « Exécuter quand même ». C'est à faire une seule fois."], ["Installez", "Choisissez la langue, puis « Suivant », « Installer » et « Terminer »."], ["Trouvez la tasse", "Elle apparaît en bas à droite, près de l'horloge. Si vous ne la voyez pas, cliquez sur la petite flèche ^ près de l'horloge, puis glissez la tasse dans la barre des tâches pour la garder visible."], ["C'est prêt !", "Un clic sur la tasse garde l'ordinateur allumé, un autre clic l'arrête. Un clic droit ouvre le menu : durées, « tant qu'une app est ouverte », lancement au démarrage."]], "why_t": "Pourquoi cet avertissement ?", "why": "Windows affiche « Windows a protégé votre ordinateur » pour tout logiciel dont l'auteur ne paie pas un certificat à Microsoft ou à un revendeur. Moka est gratuit et ne le paie pas. Cela ne veut pas dire que Moka est dangereux : chaque mise à jour est signée avec la clé de Moka et vérifiée avant d'être installée.", "upd_t": "Les mises à jour", "upd": "Quand une nouvelle version est prête, la ligne « Moka X est disponible » apparaît tout en haut du menu de la tasse. Un clic montre les nouveautés et le bouton « Mettre à jour maintenant » : Moka se ferme, s'installe et repart tout seul, sans nouvel avertissement.", "rm_t": "Désinstaller", "rm": "Menu Démarrer › Paramètres › Applications › Applications installées, puis les trois points à côté de Moka › Désinstaller."}, "en": {"title": "Install Moka on Windows", "intro": "Six steps, about three minutes. For Windows 10 and 11. No administrator password is needed.", "download": "Download Moka for Windows — Free", "other": "Other systems:", "steps": [["Download Moka", "Use the button below. If Edge says “Moka-Setup.exe isn't commonly downloaded”, click the three dots … next to it, then “Keep”, “Show more” and “Keep anyway”."], ["Open the file", "Double-click Moka-Setup.exe in your Downloads folder."], ["“Windows protected your PC”: this is normal", "A blue window appears. Click “More info” (the small link under the text), then “Run anyway”. You only do this once."], ["Install", "Choose the language, then “Next”, “Install” and “Finish”."], ["Find the cup", "It appears at the bottom right, near the clock. If you don't see it, click the small ^ arrow near the clock, then drag the cup onto the taskbar to keep it visible."], ["You're ready!", "Click the cup to keep your computer awake, click again to stop. Right-click opens the menu: durations, “while an app is open”, start at login."]], "why_t": "Why this warning?", "why": "Windows shows “Windows protected your PC” for any software whose author does not pay Microsoft or a reseller for a certificate. Moka is free and does not pay for one. This does not mean Moka is dangerous: every update is signed with Moka's key and checked before it is installed.", "upd_t": "Updates", "upd": "When a new version is ready, the line “Moka X is available” appears at the very top of the cup menu. One click shows what's new and the “Update Now” button: Moka closes, installs and starts again on its own, with no new warning.", "rm_t": "Uninstall", "rm": "Start menu › Settings › Apps › Installed apps, then the three dots next to Moka › Uninstall."}, "es": {"title": "Instalar Moka en Windows", "intro": "Seis pasos, unos tres minutos. Para Windows 10 y 11. No se pide contraseña de administrador.", "download": "Descargar Moka para Windows — Gratis", "other": "Otros sistemas:", "steps": [["Descargue Moka", "Use el botón de abajo. Si Edge indica «Moka-Setup.exe no se descarga con frecuencia», haga clic en los tres puntos … al lado y luego en «Conservar», «Mostrar más» y «Conservar de todos modos»."], ["Abra el archivo", "Haga doble clic en Moka-Setup.exe en la carpeta Descargas."], ["«Windows protegió su PC»: es normal", "Aparece una ventana azul. Haga clic en «Más información» (el pequeño enlace bajo el texto) y luego en «Ejecutar de todas formas». Solo hay que hacerlo una vez."], ["Instale", "Elija el idioma y luego «Siguiente», «Instalar» y «Finalizar»."], ["Busque la taza", "Aparece abajo a la derecha, junto al reloj. Si no la ve, haga clic en la pequeña flecha ^ junto al reloj y arrastre la taza a la barra de tareas para tenerla siempre a la vista."], ["¡Listo!", "Un clic en la taza mantiene el ordenador encendido; otro clic lo detiene. El clic derecho abre el menú: duraciones, «mientras una app esté abierta», inicio con la sesión."]], "why_t": "¿Por qué este aviso?", "why": "Windows muestra «Windows protegió su PC» para cualquier programa cuyo autor no paga un certificado a Microsoft o a un revendedor. Moka es gratuito y no lo paga. Eso no significa que Moka sea peligroso: cada actualización está firmada con la clave de Moka y se comprueba antes de instalarse.", "upd_t": "Actualizaciones", "upd": "Cuando hay una nueva versión, la línea «Moka X está disponible» aparece arriba del todo en el menú de la taza. Un clic muestra las novedades y el botón «Actualizar ahora»: Moka se cierra, se instala y vuelve a abrirse solo, sin nuevo aviso.", "rm_t": "Desinstalar", "rm": "Menú Inicio › Configuración › Aplicaciones › Aplicaciones instaladas, luego los tres puntos junto a Moka › Desinstalar."}, "pt": {"title": "Instalar o Moka no Windows", "intro": "Seis passos, cerca de três minutos. Para Windows 10 e 11. Não é pedida nenhuma senha de administrador.", "download": "Baixar o Moka para Windows — Grátis", "other": "Outros sistemas:", "steps": [["Baixe o Moka", "Use o botão abaixo. Se o Edge disser «Moka-Setup.exe não é baixado com frequência», clique nos três pontos … ao lado e depois em «Manter», «Mostrar mais» e «Manter mesmo assim»."], ["Abra o arquivo", "Clique duas vezes em Moka-Setup.exe na pasta Downloads."], ["«O Windows protegeu o computador»: é normal", "Aparece uma janela azul. Clique em «Mais informações» (o pequeno link sob o texto) e depois em «Executar assim mesmo». Só é preciso fazer isso uma vez."], ["Instale", "Escolha o idioma e depois «Avançar», «Instalar» e «Concluir»."], ["Encontre a xícara", "Ela aparece no canto inferior direito, perto do relógio. Se não a vir, clique na pequena seta ^ perto do relógio e arraste a xícara para a barra de tarefas para mantê-la visível."], ["Pronto!", "Um clique na xícara mantém o computador acordado; outro clique para. O clique direito abre o menu: durações, «enquanto um app estiver aberto», iniciar com a sessão."]], "why_t": "Por que este aviso?", "why": "O Windows mostra «O Windows protegeu o computador» para qualquer software cujo autor não paga um certificado à Microsoft ou a um revendedor. O Moka é gratuito e não paga. Isso não quer dizer que o Moka seja perigoso: cada atualização é assinada com a chave do Moka e verificada antes de ser instalada.", "upd_t": "Atualizações", "upd": "Quando uma nova versão está pronta, a linha «O Moka X está disponível» aparece no topo do menu da xícara. Um clique mostra as novidades e o botão «Atualizar agora»: o Moka fecha, instala e volta a abrir sozinho, sem novo aviso.", "rm_t": "Desinstalar", "rm": "Menu Iniciar › Configurações › Aplicativos › Aplicativos instalados, depois os três pontos ao lado do Moka › Desinstalar."}, "nl": {"title": "Moka installeren op Windows", "intro": "Zes stappen, ongeveer drie minuten. Voor Windows 10 en 11. Er wordt geen beheerderswachtwoord gevraagd.", "download": "Moka voor Windows downloaden — Gratis", "other": "Andere systemen:", "steps": [["Download Moka", "Gebruik de knop hieronder. Als Edge meldt dat „Moka-Setup.exe niet vaak wordt gedownload”, klik dan op de drie puntjes … ernaast en daarna op „Behouden”, „Meer weergeven” en „Toch behouden”."], ["Open het bestand", "Dubbelklik op Moka-Setup.exe in de map Downloads."], ["„Uw pc is beveiligd door Windows”: dat is normaal", "Er verschijnt een blauw venster. Klik op „Meer informatie” (het kleine linkje onder de tekst) en daarna op „Toch uitvoeren”. Dat hoeft maar één keer."], ["Installeer", "Kies de taal, daarna „Volgende”, „Installeren” en „Voltooien”."], ["Zoek het kopje", "Het verschijnt rechtsonder, bij de klok. Ziet u het niet, klik dan op het pijltje ^ bij de klok en sleep het kopje naar de taakbalk zodat het zichtbaar blijft."], ["Klaar!", "Eén klik op het kopje houdt de computer wakker, nog een klik stopt het. Rechtsklikken opent het menu: duur, „zolang een app open is”, starten bij aanmelden."]], "why_t": "Waarom deze waarschuwing?", "why": "Windows toont „Uw pc is beveiligd door Windows” bij elke software waarvan de maker geen certificaat bij Microsoft of een wederverkoper betaalt. Moka is gratis en betaalt er geen. Dat betekent niet dat Moka gevaarlijk is: elke update is ondertekend met de sleutel van Moka en wordt gecontroleerd voordat hij wordt geïnstalleerd.", "upd_t": "Updates", "upd": "Staat er een nieuwe versie klaar, dan verschijnt de regel „Moka X is beschikbaar” helemaal bovenaan in het menu van het kopje. Eén klik toont wat er nieuw is en de knop „Nu bijwerken”: Moka sluit, installeert en start vanzelf opnieuw, zonder nieuwe waarschuwing.", "rm_t": "Verwijderen", "rm": "Startmenu › Instellingen › Apps › Geïnstalleerde apps, daarna de drie puntjes naast Moka › Verwijderen."}, "de": {"title": "Moka unter Windows installieren", "intro": "Sechs Schritte, etwa drei Minuten. Für Windows 10 und 11. Es wird kein Administratorpasswort verlangt.", "download": "Moka für Windows herunterladen — Kostenlos", "other": "Andere Systeme:", "steps": [["Laden Sie Moka herunter", "Nutzen Sie die Schaltfläche unten. Meldet Edge „Moka-Setup.exe wird selten heruntergeladen“, klicken Sie auf die drei Punkte … daneben, dann auf „Beibehalten“, „Mehr anzeigen“ und „Trotzdem beibehalten“."], ["Öffnen Sie die Datei", "Doppelklicken Sie im Ordner Downloads auf Moka-Setup.exe."], ["„Der Computer wurde durch Windows geschützt“: das ist normal", "Ein blaues Fenster erscheint. Klicken Sie auf „Weitere Informationen“ (der kleine Link unter dem Text) und dann auf „Trotzdem ausführen“. Das ist nur einmal nötig."], ["Installieren Sie", "Wählen Sie die Sprache, dann „Weiter“, „Installieren“ und „Fertigstellen“."], ["Finden Sie die Tasse", "Sie erscheint unten rechts neben der Uhr. Sehen Sie sie nicht, klicken Sie auf den kleinen Pfeil ^ neben der Uhr und ziehen Sie die Tasse in die Taskleiste, damit sie sichtbar bleibt."], ["Fertig!", "Ein Klick auf die Tasse hält den Computer wach, ein weiterer Klick beendet es. Ein Rechtsklick öffnet das Menü: Dauer, „solange eine App geöffnet ist“, Start bei der Anmeldung."]], "why_t": "Warum diese Warnung?", "why": "Windows zeigt „Der Computer wurde durch Windows geschützt“ bei jeder Software, deren Autor kein Zertifikat bei Microsoft oder einem Händler bezahlt. Moka ist kostenlos und bezahlt keins. Das heißt nicht, dass Moka gefährlich ist: Jedes Update ist mit dem Schlüssel von Moka signiert und wird vor der Installation geprüft.", "upd_t": "Updates", "upd": "Ist eine neue Version bereit, erscheint die Zeile „Moka X ist verfügbar“ ganz oben im Menü der Tasse. Ein Klick zeigt die Neuerungen und die Schaltfläche „Jetzt aktualisieren“: Moka schließt sich, installiert sich und startet von selbst neu, ohne neue Warnung.", "rm_t": "Deinstallieren", "rm": "Startmenü › Einstellungen › Apps › Installierte Apps, dann die drei Punkte neben Moka › Deinstallieren."}, "it": {"title": "Installare Moka su Windows", "intro": "Sei passaggi, circa tre minuti. Per Windows 10 e 11. Non viene chiesta nessuna password di amministratore.", "download": "Scarica Moka per Windows — Gratis", "other": "Altri sistemi:", "steps": [["Scarica Moka", "Usa il pulsante qui sotto. Se Edge dice «Moka-Setup.exe non viene scaricato di frequente», fai clic sui tre puntini … accanto, poi su «Mantieni», «Mostra altro» e «Mantieni comunque»."], ["Apri il file", "Fai doppio clic su Moka-Setup.exe nella cartella Download."], ["«PC protetto da Windows»: è normale", "Compare una finestra blu. Fai clic su «Ulteriori informazioni» (il piccolo link sotto il testo), poi su «Esegui comunque». Va fatto una sola volta."], ["Installa", "Scegli la lingua, poi «Avanti», «Installa» e «Fine»."], ["Trova la tazza", "Compare in basso a destra, vicino all'orologio. Se non la vedi, fai clic sulla piccola freccia ^ vicino all'orologio e trascina la tazza sulla barra delle applicazioni per tenerla visibile."], ["È pronto!", "Un clic sulla tazza tiene acceso il computer, un altro clic lo ferma. Il clic destro apre il menu: durate, «finché un'app è aperta», avvio all'accesso."]], "why_t": "Perché questo avviso?", "why": "Windows mostra «PC protetto da Windows» per qualsiasi software il cui autore non paga un certificato a Microsoft o a un rivenditore. Moka è gratuito e non lo paga. Questo non significa che Moka sia pericoloso: ogni aggiornamento è firmato con la chiave di Moka e verificato prima di essere installato.", "upd_t": "Aggiornamenti", "upd": "Quando è pronta una nuova versione, la riga «Moka X è disponibile» compare in cima al menu della tazza. Un clic mostra le novità e il pulsante «Aggiorna ora»: Moka si chiude, si installa e riparte da solo, senza nuovi avvisi.", "rm_t": "Disinstallare", "rm": "Menu Start › Impostazioni › App › App installate, poi i tre puntini accanto a Moka › Disinstalla."}};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(lang) {
  const t = T[lang] || T.en;
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("title").textContent = t.title;
  document.getElementById("intro").textContent = t.intro;
  document.getElementById("steps").innerHTML = t.steps.map((s, i) => `<li class="step"><div><span class="number">${i + 1}</span><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>` +
    (s[2] ? `<pre>${esc(s[2])}</pre>` : "") + (i === 0 ? `<a class="download" href="${downloadURL}">⬇︎ ${esc(t.download)}</a>` : "") + `</div></li>`).join("");
  document.getElementById("notes").innerHTML = (t.why_t ? `<p><b>${esc(t.why_t)}</b> ${esc(t.why)}</p>` : "") +
    `<p><b>${esc(t.upd_t)}</b> ${esc(t.upd)}</p><p><b>${esc(t.rm_t)}</b> ${esc(t.rm)}</p>`;
  document.getElementById("others").innerHTML = esc(t.other) + " " + OTHER.map(([h, n]) => `<a href="${h}">${n}</a>`).join(" ");
  document.getElementById("langs").innerHTML = Object.keys(T).map((l) => `<button type="button" data-l="${l}" aria-pressed="${l === lang}" title="${l}">${FLAGS[l]}</button>`).join("");
  try { localStorage.setItem("lang", lang); } catch (e) {}
}
document.getElementById("langs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.l); });
let start = "fr";
try { start = localStorage.getItem("lang") || ""; } catch (e) {}
if (!T[start]) start = ((navigator.language || "fr").slice(0, 2).toLowerCase());
show(T[start] ? start : "en");
</script>
